name: Windows derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Vosk kütüphanesini indir ve exe'ye gömmek için paketle
        shell: bash
        run: |
          curl -L -o vosk.zip https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip
          7z x vosk.zip -ovosk -y > /dev/null
          mkdir -p vendor
          (cd vosk/vosk-win64-0.3.45 && 7z a -tzip ../../vendor/vosk.zip libvosk.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll > /dev/null)

      - name: Derle
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --color never 2>&1 | tee derleme.log || {
            grep -E "^error" -A8 derleme.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Paketle
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/edith.exe dist/
          cd dist
          7z a ../edith-windows.zip edith.exe > /dev/null

      - name: Değişiklik listesini hazırla (commit mesajlarından)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$( (gh release view son-surum --json body --jq .body | sed -n 's/.*Otomatik derleme: \([0-9a-f]\{40\}\).*/\1/p' | head -1) || true )
          gh release download son-surum -p CHANGELOG.md -O onceki.md || : > onceki.md
          python .github/degisiklik.py "$prev" "${GITHUB_RUN_NUMBER}" onceki.md CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: edith-windows
          path: edith-windows.zip

      - name: Sürüm olarak yayınla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum edith-windows.zip dist/edith.exe CHANGELOG.md \
            --title "Son sürüm" --notes "Sürüm: 0.4.${GITHUB_RUN_NUMBER} · Otomatik derleme: ${{ github.sha }}" --prerelease
